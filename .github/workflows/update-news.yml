name: Update CEE Strategic Monitor News

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python csomagok telepítése
        run: pip install -r requirements.txt

      - name: Hírgyűjtő script futtatása
        run: python scripts/fetch_news.py

      - name: History frissítés
        run: python scripts/update_history.py

      - name: Változások commitolása
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/latest_status.json
          git add docs/data/raw_news.json
          git add docs/data/history/regional_history.json
          git add docs/data/history/country_history.json

          git commit -m "Update CEE Strategic Monitor data" || echo "Nincs változás"

          git push
